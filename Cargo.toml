[workspace]
resolver = "2"
members  = [
    "crates/protocol",
    "crates/sica-core",
    "crates/llm",
    "crates/agents",
    "crates/idealist",
    "crates/backend",
    "crates/frontend",
]

[workspace.package]
edition      = "2021"
rust-version = "1.82"
version      = "0.1.0"
license      = "MIT OR Apache-2.0"
authors      = ["sica-rust"]

[workspace.dependencies]
serde                  = { version = "1", features = ["derive"] }
bincode                = "1.3"
serde_json             = "1"
tokio                  = { version = "1", features = ["full"] }
tokio-util             = { version = "0.7", features = ["codec", "rt"] }
bytes                  = "1"
anyhow                 = "1"
thiserror              = "1"
tracing                = "0.1"
tracing-subscriber     = { version = "0.3", features = ["env-filter", "fmt"] }
futures                = "0.3"
interprocess           = { version = "2", features = ["tokio"] }
parking_lot            = "0.12"
eframe                 = { version = "0.28", default-features = false, features = ["default_fonts", "glow"] }
egui                   = "0.28"
egui_commonmark        = { version = "0.17", default-features = false, features = ["pulldown_cmark"] }
notify                 = "6"
notify-debouncer-mini  = "0.4"
reqwest                = { version = "0.12", default-features = false, features = ["json", "stream", "http2", "native-tls"] }
eventsource-stream     = "0.2"
crossbeam-channel      = "0.5"
url                    = "2"
html2text              = "0.12"
# `run-code` (guide §7): the sandboxed script runtime behind programmatic
# tool calling. Pure Rust, no I/O of its own, hard caps on operations,
# recursion and value sizes.
rhai                   = "1.26"
# MCP client (guide §13.2). Client + stdio child transport only — the
# server half, the macros and the HTTP transports are not used here.
rmcp                   = { version = "3", default-features = false, features = ["client", "transport-child-process"] }
chrono                 = { version = "0.4", features = ["serde"] }
once_cell              = "1"
regex                  = "1"
ignore                 = "0.4"
async-trait            = "0.1"
toml                   = "0.8"
base64                 = "0.22"
rfd                    = { version = "0.14", default-features = false }
arboard                = { version = "3", default-features = false, features = ["image-data"] }
image                  = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
resvg                  = { version = "0.44", default-features = false }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "symbols"
