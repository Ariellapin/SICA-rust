<?xml version="1.0" encoding="UTF-8"?>
<!-- sica-rust application icon.

     The window/taskbar icon. Rasterised at startup by
     `crates/frontend/src/icon.rs` — this file *is* the icon, not a sketch of
     one, so a change here changes the shipped icon.

     The mark is the same blade-and-loop geometry as `mark.svg`, scaled 3.1x
     about the tile centre and filled with the accent gradient instead of a
     flat white. Keep the two in sync.

     Colours come from `sica_core::theme`: the tile is bluish-1000 (the dark
     page ground) and the gradient runs across the accent ramp, 400 -> 450 ->
     a shade below 500 so the mark still separates on a light taskbar.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"   stop-color="#9CC0FF"/>
      <stop offset="0.5" stop-color="#5686FE"/>
      <stop offset="1"   stop-color="#2E5FD4"/>
    </linearGradient>

    <!-- A cool bloom behind the mark; keeps the tile from reading as a flat
         rectangle at 256 px without adding noise at 16 px. -->
    <radialGradient id="bloom" cx="0.62" cy="0.34" r="0.72">
      <stop offset="0" stop-color="#4176E6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#4176E6" stop-opacity="0"/>
    </radialGradient>

    <!-- Same blade clearance as mark.svg, in mark-local coordinates. -->
    <mask id="blade-clearance" maskUnits="userSpaceOnUse" x="-8" y="-8" width="80" height="80">
      <rect x="-8" y="-8" width="80" height="80" fill="#ffffff"/>
      <path d="M 17 47 C 15 33 24 20 56 11 C 41 24 30 36 26 50 Z"
            fill="none" stroke="#000000" stroke-width="6" stroke-linejoin="round"/>
    </mask>
  </defs>

  <rect width="256" height="256" rx="56" ry="56" fill="#0F1115"/>
  <rect width="256" height="256" rx="56" ry="56" fill="url(#bloom)"/>

  <g transform="translate(128,128) scale(3.1) translate(-32,-32)">
    <circle cx="32" cy="32" r="25"
            fill="none" stroke="url(#accent)" stroke-width="5.5"
            stroke-dasharray="124.6 30" stroke-linecap="round"
            mask="url(#blade-clearance)"/>
    <path d="M 17 47 C 15 33 24 20 56 11 C 41 24 30 36 26 50 Z" fill="url(#accent)"/>
  </g>
</svg>
