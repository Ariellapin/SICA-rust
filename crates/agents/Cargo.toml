[package]
name         = "agents"
edition      = { workspace = true }
version      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }

[dependencies]
protocol    = { path = "../protocol" }
sica-core   = { path = "../sica-core" }
llm         = { path = "../llm" }
serde       = { workspace = true }
serde_json  = { workspace = true }
anyhow      = { workspace = true }
tokio       = { workspace = true }
tokio-util  = { workspace = true }
tracing     = { workspace = true }
futures     = { workspace = true }
async-trait = { workspace = true }
once_cell   = { workspace = true }
# `model-eval`: TOML suites, regex checks, timestamped report filenames.
toml        = { workspace = true }
regex       = { workspace = true }
chrono      = { workspace = true }
# `glob` / `grep`: gitignore-aware walking + gitignore-style glob matching.
ignore      = { workspace = true }

# `proc`: Job Objects so a killed shell takes its child processes with it.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
